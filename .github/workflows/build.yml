name: Build Tweak
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        uses: theos/setup-theos@main

      - name: Build
        run: make package

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: TweakDeb
          path: packages/*.deb